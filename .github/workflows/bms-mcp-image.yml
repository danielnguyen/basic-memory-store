name: BMS MCP adapter image
on:
  pull_request:
    paths:
      - 'integrations/chatgpt_mcp/**'
      - '.github/workflows/bms-mcp-image.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/chatgpt_mcp/**'
      - '.github/workflows/bms-mcp-image.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test read-only MCP adapter
        run: |
          python -m pip install -r integrations/chatgpt_mcp/requirements.txt pytest==9.0.2
          PYTHONPATH=integrations/chatgpt_mcp python -m pytest integrations/chatgpt_mcp/test_server.py -q
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and optionally publish MCP adapter
        uses: docker/build-push-action@v6
        with:
          context: .
          file: integrations/chatgpt_mcp/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            danielnguyen/basic-memory-store-mcp:latest
            danielnguyen/basic-memory-store-mcp:${{ github.sha }}
