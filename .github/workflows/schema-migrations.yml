name: Schema migrations

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: python -m pip install -r api/requirements.txt

      - name: Run migration tests
        run: |
          cd api
          python -m pytest -q \
            tests/test_memory_items_migration.py \
            tests/test_episodes_migration.py \
            tests/test_recall_migration.py \
            tests/test_schema_migrations_integration.py

      - name: Validate compose configuration
        run: docker compose config >/tmp/basic-memory-store.compose.txt

      - name: Build image from repo root
        run: docker build -f api/Dockerfile -t basic-memory-store:test .

      - name: Verify packaged migration assets
        run: |
          docker run --rm basic-memory-store:test sh -lc \
            'test -f /app/db/baseline.sql && test -d /app/db/migrations/managed && test -f /app/api/tools/schema_migrations.py'
